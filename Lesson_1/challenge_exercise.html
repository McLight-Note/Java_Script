<!Doctype html>
<html>
  <head>
    <title>Buttons</title>
    <style>
      .yellow-button {
        background-color: yellow;
        color: black;
      }
      .orange-button {
        background-color: orange;
        color: black;
      }
    </style>
  </head>
  <body> 
    <p>
      Adults Plain Cotton T-Shirt
    </p>
    <p>
      Price: $19.99
    </p>
    
    <button class="yellow-button" onclick="alert('Added to cart')">
      Add to cart
    </button>
    <button class="orange-button" onclick="alert('Loading...')">
      Buy now
    </button>

    <script> alert("Welcome") </script>
  </body>
</html>
